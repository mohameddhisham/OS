services:
  - type: web
    name: data-tools
    runtime: python
    plan: free               # change to a paid plan if big files run out of memory
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 300
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_PASSWORD
        sync: false          # you type it in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: JOB_TTL_MINUTES
        value: "120"
      - key: MAX_UPLOAD_MB
        value: "300"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
